<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4f46e5">
    <title>Offline · DM System</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; color: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
        .card { max-width: 22rem; margin: 1rem; padding: 2rem 1.5rem; background: #fff; border: 1px solid #e2e8f0; border-radius: 1.5rem; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
        .logo { width: 3rem; height: 3rem; margin: 0 auto 1rem; border-radius: .9rem; background: linear-gradient(135deg, #4f46e5, #8b5cf6); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; }
        h1 { font-size: 1.1rem; margin: 0 0 .5rem; }
        p { font-size: .8rem; color: #64748b; line-height: 1.5; margin: 0 0 1.25rem; }
        button { border: 0; border-radius: .75rem; padding: .7rem 1.2rem; background: #4f46e5; color: #fff; font-weight: 600; font-size: .8rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">DM</div>
        <h1>You're offline</h1>
        <p>No internet connection right now. Location points you collected are saved on this phone and upload automatically when you reconnect.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
